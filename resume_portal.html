<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Profile System</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e9f2;
  --brand:#4f46e5; --brand2:#0ea5e9; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}

.app{display:flex;min-height:100vh}
.sidebar{width:264px;background:#0b1220;color:#cbd5e1;position:fixed;inset:0 auto 0 0;overflow-y:auto;z-index:40;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1e293b}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:18px}
.brand h2{font-size:14px;color:#fff;font-weight:700;letter-spacing:.2px}
.brand p{font-size:11px;color:#64748b}
.nav{padding:10px 10px 30px;flex:1}
.nav-group{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#475569;padding:16px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;color:#cbd5e1;font-size:13px;text-align:left;transition:.15s;margin-bottom:1px}
.nav-item:hover{background:#151f33;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(79,70,229,.9),rgba(14,165,233,.75));color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:700}

.main{margin-left:264px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.topbar p{font-size:12px;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.role-sel{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12px;font-weight:600}
.role-sel:disabled{opacity:.85;cursor:not-allowed;background:#f8fafc}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative;font-size:16px}
.icon-btn:hover{border-color:#c7d2fe}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff;display:none}
.dot.on{display:block}
.avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.view{padding:24px 26px 60px;flex:1}

.sync-status{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
.sync-status:hover{border-color:#c7d2fe;background:#f8faff}
.sync-status .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sync-status .sync-dot.on{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.sync-status .sync-dot.off{background:#94a3b8}
.sync-status .sync-dot.busy{background:#f59e0b;animation:pulse 1s infinite}
@media(max-width:640px){.sync-status span:last-child{display:none}}

/* ============================================================
   CLOUD UPLOAD / DOWNLOAD INDICATORS (side by side)
   ============================================================ */
.cloud-pair{display:flex;gap:8px;align-items:center}

.cloud-ind{
  display:flex;align-items:center;gap:6px;
  padding:4px 12px 4px 6px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:14px;
  cursor:pointer;
  transition:transform .15s, border-color .2s, box-shadow .2s;
  user-select:none;
  position:relative;
}
.cloud-ind:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(15,23,42,.08)}
.cloud-ind.is-upload:hover{border-color:#86efac}
.cloud-ind.is-download:hover{border-color:#7dd3fc}

/* Icon wrapper — fixed square so arrow + cloud align */
.cloud-icon{
  position:relative;
  width:44px;height:44px;
  flex-shrink:0;
  display:grid;place-items:center;
}
.cloud-icon svg{
  display:block;width:44px;height:44px;
  overflow:visible;
}

/* Cloud base outline (always visible) */
.cloud-base{
  fill:#ffffff;
  stroke:#94a3b8;
  stroke-width:1.1;
  transition:stroke .3s, fill .3s;
}
/* Cloud progress fill (clipped from bottom) */
.cloud-fill{
  fill:#cbd5e1;
  transition:fill .3s;
}
/* Arrow inside the cloud */
.cloud-arrow{
  fill:#475569;
  transition:fill .3s;
}

/* ---------- UPLOAD (green) ---------- */
.cloud-ind.is-upload .cloud-base{stroke:#10b981}
.cloud-ind.is-upload .cloud-fill{fill:#a7f3d0}
.cloud-ind.is-upload .cloud-arrow{fill:#047857}
.cloud-ind.is-upload.is-active .cloud-base{stroke:#059669;stroke-width:1.4}
.cloud-ind.is-upload.is-active .cloud-fill{fill:#10b981;animation:cloudPulse 1s ease-in-out infinite}
.cloud-ind.is-upload.is-active .cloud-arrow{fill:#ffffff}

/* ---------- DOWNLOAD (blue) ---------- */
.cloud-ind.is-download .cloud-base{stroke:#0ea5e9}
.cloud-ind.is-download .cloud-fill{fill:#bae6fd}
.cloud-ind.is-download .cloud-arrow{fill:#0369a1}
.cloud-ind.is-download.is-active .cloud-base{stroke:#0284c7;stroke-width:1.4}
.cloud-ind.is-download.is-active .cloud-fill{fill:#0ea5e9;animation:cloudPulse 1s ease-in-out infinite}
.cloud-ind.is-download.is-active .cloud-arrow{fill:#ffffff}

/* ---------- ERROR ---------- */
.cloud-ind.is-error .cloud-base{stroke:#ef4444}
.cloud-ind.is-error .cloud-fill{fill:#fecaca}
.cloud-ind.is-error .cloud-arrow{fill:#b91c1c}
.cloud-ind.is-error.is-active .cloud-fill{fill:#ef4444;animation:cloudPulse 1s ease-in-out infinite}
.cloud-ind.is-error.is-active .cloud-arrow{fill:#ffffff}

/* ---------- OFFLINE ---------- */
.cloud-ind.is-offline .cloud-base{stroke:#94a3b8}
.cloud-ind.is-offline .cloud-fill{fill:#e2e8f0}
.cloud-ind.is-offline .cloud-arrow{fill:#64748b}

/* Percentage + label text */
.cloud-info{display:flex;flex-direction:column;line-height:1.1;min-width:56px}
.cloud-pct{
  font-size:15px;font-weight:800;color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.3px;
}
.cloud-lbl{
  font-size:9px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;margin-top:1px;
}
.cloud-ind.is-upload .cloud-lbl{color:#059669}
.cloud-ind.is-download .cloud-lbl{color:#0284c7}
.cloud-ind.is-error .cloud-lbl{color:#dc2626}
.cloud-ind.is-offline .cloud-lbl{color:#64748b}

/* Responsive */
@media(max-width:1180px){
  .cloud-info{min-width:44px}
  .cloud-pct{font-size:13.5px}
  .cloud-lbl{font-size:8px}
}
@media(max-width:980px){
  .cloud-icon,.cloud-icon svg{width:38px;height:38px}
  .cloud-ind{padding:4px 8px 4px 4px;gap:4px}
}
@media(max-width:820px){
  .cloud-icon,.cloud-icon svg{width:34px;height:34px}
  .cloud-info{min-width:40px}
}
@media(max-width:640px){
  .cloud-icon,.cloud-icon svg{width:30px;height:30px}
  .cloud-ind{padding:3px 6px 3px 3px;gap:3px;border-radius:11px}
  .cloud-pct{font-size:12px}
  .cloud-lbl{display:none}
}
@media(max-width:480px){
  .cloud-info{display:none}
  .cloud-ind{padding:3px}
}

@keyframes cloudPulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.main{margin-left:0}.view{padding:16px}.topbar{padding:12px 16px}}

.section-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;transition:.15s}
.btn:hover{border-color:#c7d2fe;background:#f8faff}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;box-shadow:0 4px 14px rgba(79,70,229,.28)}
.btn-primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--brand),var(--brand2))}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-ok{background:linear-gradient(135deg,#10b981,#34d399);color:#fff;border:none;box-shadow:0 4px 14px rgba(16,185,129,.28)}
.btn-ok:hover{filter:brightness(1.06);background:linear-gradient(135deg,#10b981,#34d399)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;transition:.15s;box-shadow:var(--shadow);cursor:pointer;width:100%}
.stat:hover{transform:translateY(-2px);border-color:#c7d2fe}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-1px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stat .ic{font-size:18px;margin-bottom:6px;display:block}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2ff;color:#4338ca}
.pill.green{background:#dcfce7;color:#15803d}
.pill.amber{background:#fef3c7;color:#b45309}
.pill.red{background:#fee2e2;color:#b91c1c}
.pill.gray{background:#f1f5f9;color:#475569}
.pill.sky{background:#e0f2fe;color:#0369a1}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #f1f5f9;vertical-align:top;font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbff}
.tbl-wrap{overflow-x:auto}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px}

.fld{display:flex;flex-direction:column;gap:5px}
.fld span{font-size:11.5px;font-weight:700;color:#475569}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:.15s;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.fld.full{grid-column:1/-1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;border-radius:18px 18px 0 0}
.modal-head h3{font-size:16px;font-weight:800}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;flex-wrap:wrap}

.ring{position:relative;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),#e2e8f0 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}

.bar-row{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;margin-bottom:9px;font-size:12px}
.bar{height:9px;background:#eef2f7;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2))}

.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.step .num{width:24px;height:24px;border-radius:50%;background:#eef2ff;color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}
.step.done .num{background:var(--ok);color:#fff}

#cvDoc{background:#fff;padding:48px 54px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);max-width:900px;margin:0 auto;font-size:13px;line-height:1.55;color:#111827}
#cvDoc h1{font-size:26px;letter-spacing:-.5px;margin-bottom:2px}
#cvDoc h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--brand);border-bottom:2px solid #e5e9f2;padding-bottom:5px;margin:22px 0 10px;font-weight:800}
#cvDoc .cvitem{margin-bottom:10px}
#cvDoc .cvitem b{font-weight:700}
#cvDoc ul{margin-left:16px}
.sec-pick{display:flex;flex-wrap:wrap;gap:8px}
.sec-pick label{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;cursor:pointer;font-weight:600}
.sec-pick label:hover{border-color:#c7d2fe;background:#f8faff}
.sec-pick input{accent-color:var(--brand)}

.pub-hero{background:linear-gradient(135deg,#4f46e5,#0ea5e9);border-radius:18px;padding:30px;color:#fff;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pub-hero .ph{width:84px;height:84px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:40px;border:2px solid rgba(255,255,255,.35)}
.pub-hero h2{font-size:24px;letter-spacing:-.5px}
.pub-hero p{opacity:.9;font-size:13px}

.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:500}

.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:13px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:300;animation:pop .2s}
.hint{background:#f0f9ff;border:1px solid #bae6fd;color:#075985;padding:12px 14px;border-radius:11px;font-size:12.5px;line-height:1.6}
.hint.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.hint.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.hint.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}

.sync-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-dot.on{background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.18)}
.sync-dot.off{background:#94a3b8}
.sync-dot.busy{background:#f59e0b;animation:pulse 1s infinite}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.log{background:#0b1220;color:#cbd5e1;border-radius:10px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.7}
.log .t{color:#64748b}
.log .ok{color:#34d399}
.log .er{color:#f87171}
.log .in{color:#38bdf8}

.user-badge{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}
.user-badge:hover{border-color:#c7d2fe;background:#f8faff}
.user-badge .uinfo{display:flex;flex-direction:column;line-height:1.1}
.user-badge .uname{font-size:11px;font-weight:800;color:var(--ink);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.user-badge .urole{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
@media(max-width:640px){.user-badge .uinfo{display:none}}

.logout-progress{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;font-size:12.5px}
.logout-progress.done{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.logout-progress.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}

@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .main{margin:0!important}
  .view{padding:0!important}
  body{background:#fff}
  #cvDoc{border:0;box-shadow:none;padding:0;max-width:none}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">—</p>
      </div>
      <div class="tb-right">

        <!-- === CLOUD INDICATORS: DOWNLOAD (kiri, biru) + UPLOAD (kanan, hijau) === -->
        <div class="cloud-pair">

          <!-- ===== DOWNLOAD cloud (arrow down, blue) ===== -->
          <div class="cloud-ind is-download" id="downloadIndicator"
               onclick="go('cloudSync')" title="Download progress">
            <div class="cloud-icon">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <clipPath id="downloadClip">
                    <rect id="downloadClipRect" x="0" y="24" width="24" height="0"/>
                  </clipPath>
                </defs>
                <!-- cloud outline -->
                <path class="cloud-base"
                  d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                <!-- cloud progress fill (clipped) -->
                <path class="cloud-fill" clip-path="url(#downloadClip)"
                  d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                <!-- arrow DOWN -->
                <path class="cloud-arrow" d="M12 17.2l4-4.6h-2.4V7h-3.2v5.6H8z"/>
              </svg>
            </div>
            <div class="cloud-info">
              <span class="cloud-pct" id="downloadPct">100%</span>
              <span class="cloud-lbl" id="downloadLabel">DOWNLOAD</span>
            </div>
          </div>

          <!-- ===== UPLOAD cloud (arrow up, green) ===== -->
          <div class="cloud-ind is-upload" id="uploadIndicator"
               onclick="go('cloudSync')" title="Upload progress">
            <div class="cloud-icon">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <clipPath id="uploadClip">
                    <rect id="uploadClipRect" x="0" y="24" width="24" height="0"/>
                  </clipPath>
                </defs>
                <!-- cloud outline -->
                <path class="cloud-base"
                  d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>

/* =========================================================
   CLOUD UPLOAD / DOWNLOAD INDICATORS
   ---------------------------------------------------------
   Setiap indikator guna SVG cloud dengan:
   - outline (cloud-base) : sentiasa kelihatan
   - fill   (cloud-fill)  : di-clip dari bawah ke atas ikut %
   - arrow  (cloud-arrow) : di tengah cloud
   ========================================================= */
function createCloudIndicator(opts){
  const SVG_H = 24; // tinggi viewBox

  return {
    dir: opts.dir,                 // 'upload' | 'download'
    pct: 100,
    mode: 'ok',                    // 'ok' | 'active' | 'error' | 'offline'
    simulate: null,

    _cache(){
      this.wrapEl   = document.getElementById(opts.wrapId);
      this.pctEl    = document.getElementById(opts.pctId);
      this.lblEl    = document.getElementById(opts.labelId);
      this.clipRect = document.getElementById(opts.clipRectId);
    },

    render(){
      if(!this.wrapEl) this._cache();
      if(!this.wrapEl) return;

      this.pct = Math.max(0, Math.min(100, Math.round(this.pct)));

      // ---- Update SVG clip rect (fill from bottom up) ----
      if(this.clipRect){
        const h = SVG_H * this.pct / 100;
        const y = SVG_H - h;
        this.clipRect.setAttribute('y', y);
        this.clipRect.setAttribute('height', h);
      }

      // ---- Percentage text ----
      if(this.pctEl) this.pctEl.textContent = this.pct + '%';

      // ---- Reset state classes ----
      this.wrapEl.classList.remove('is-error','is-offline','is-active');

      // ---- Mode classes ----
      if(this.mode === 'active'){
        this.wrapEl.classList.add('is-active');
      } else if(this.mode === 'error'){
        this.wrapEl.classList.add('is-error');
      } else if(this.mode === 'offline'){
        this.wrapEl.classList.add('is-offline');
      }

      // ---- Label text ----
      if(this.lblEl){
        const isDownload = this.dir === 'download';
        this.lblEl.textContent =
          this.mode === 'active'  ? (isDownload ? 'DOWNLOADING' : 'UPLOADING') :
          this.mode === 'error'   ? 'FAILED'  :
          this.mode === 'offline' ? 'OFFLINE' :
          (isDownload ? 'DOWNLOAD' : 'UPLOAD');
      }

      // ---- Tooltip ----
      if(this.wrapEl){
        const dirCap = this.dir === 'download' ? 'Download' : 'Upload';
        this.wrapEl.title =
          this.mode === 'active'  ? dirCap + 'ing… ' + this.pct + '%' :
          this.mode === 'error'   ? dirCap + ' failed — click to retry' :
          this.mode === 'offline' ? 'Offline — will retry when online' :
          'Cloud synced · ' + dirCap.toLowerCase() + ' ' + this.pct + '%';
      }
    },

    set(pct, mode){
      if(pct !== undefined && pct !== null) this.pct = pct;
      if(mode) this.mode = mode;
      this.render();
    },

    // Start from current pct (for upload, resume)
    start(){
      if(this.simulate) return;
      let p = Math.max(5, Math.min(this.pct, 90));
      if(this.pct >= 90) p = 5;
      this.set(p, 'active');
      const self = this;
      this.simulate = setInterval(() => {
        if(p < 92){
          p += Math.random() * 6 + 1.5;
          self.set(Math.min(p, 92), 'active');
        }
      }, 380);
    },

    // Start from 0 (for download, fresh pull)
    startFromZero(){
      if(this.simulate) return;
      let p = 0;
      this.set(p, 'active');
      const self = this;
      this.simulate = setInterval(() => {
        if(p < 92){
          p += Math.random() * 6 + 1.5;
          self.set(Math.min(p, 92), 'active');
        }
      }, 380);
    },

    stop(){
      if(this.simulate){ clearInterval(this.simulate); this.simulate = null; }
    },

    done(){
      this.stop();
      this.set(100, 'ok');
    },

    error(){
      this.stop();
      this.pct = 0;
      this.mode = 'error';
      this.render();
    },

    offline(){
      this.stop();
      this.mode = 'offline';
      this.render();
    },

    idle(){
      this.stop();
      this.mode = 'ok';
      this.render();
    }
  };
}

const UPLOAD_INDICATOR = createCloudIndicator({
  dir: 'upload',
  wrapId: 'uploadIndicator',
  pctId: 'uploadPct',
  labelId: 'uploadLabel',
  clipRectId: 'uploadClipRect'
});

const DOWNLOAD_INDICATOR = createCloudIndicator({
  dir: 'download',
  wrapId: 'downloadIndicator',
  pctId: 'downloadPct',
  labelId: 'downloadLabel',
  clipRectId: 'downloadClipRect'
});

/* Backward-compat facade: still expose old names so rest of code works */
const UPLOAD_BATTERY   = UPLOAD_INDICATOR;
const DOWNLOAD_BATTERY = DOWNLOAD_INDICATOR;

const BATTERY = {
  get upload(){ return UPLOAD_INDICATOR; },
  get download(){ return DOWNLOAD_INDICATOR; },
  render(){ UPLOAD_INDICATOR.render(); DOWNLOAD_INDICATOR.render(); },
  startCharging(){ UPLOAD_INDICATOR.start(); },
  startDownload(){ DOWNLOAD_INDICATOR.startFromZero(); },
  stopSim(){ UPLOAD_INDICATOR.stop(); DOWNLOAD_INDICATOR.stop(); },
  done(direction){
    if(direction === 'download')      DOWNLOAD_INDICATOR.done();
    else if(direction === 'upload')   UPLOAD_INDICATOR.done();
    else { UPLOAD_INDICATOR.done(); DOWNLOAD_INDICATOR.done(); }
  },
  error(direction){
    if(direction === 'download')      DOWNLOAD_INDICATOR.error();
    else if(direction === 'upload')   UPLOAD_INDICATOR.error();
    else { UPLOAD_INDICATOR.error(); DOWNLOAD_INDICATOR.error(); }
  },
  offline(direction){
    if(direction === 'download')      DOWNLOAD_INDICATOR.offline();
    else if(direction === 'upload')   UPLOAD_INDICATOR.offline();
    else { UPLOAD_INDICATOR.offline(); DOWNLOAD_INDICATOR.offline(); }
  },
  idle(direction){
    if(direction === 'download')      DOWNLOAD_INDICATOR.idle();
    else if(direction === 'upload')   UPLOAD_INDICATOR.idle();
    else { UPLOAD_INDICATOR.idle(); DOWNLOAD_INDICATOR.idle(); }
  },
  set(pct, mode, direction){
    if(direction === 'download')      DOWNLOAD_INDICATOR.set(pct, mode);
    else                              UPLOAD_INDICATOR.set(pct, mode);
  }
};
window.BATTERY = BATTERY;
window.UPLOAD_BATTERY = UPLOAD_BATTERY;
window.DOWNLOAD_BATTERY = DOWNLOAD_BATTERY;

function L(key, fallback){
  return (I18N[LANG] && I18N[LANG][key]) || (I18N.ms[key]) || fallback || key;
}

function setLang(lang){
  LANG = (lang === 'en') ? 'en' : 'ms';
  localStorage.setItem('aps_lang', LANG);
  document.documentElement.lang = LANG;
  render();
  toast(L('toast.langChanged') + ' ' + (LANG === 'en' ? 'English' : 'Bahasa Melayu'));
}

const LS_KEY = 'academic_profile_system_v2_' + (CURRENT_USER.id || 'anon');
let DB;

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    Object.keys(SCHEMA).forEach(k => { if(!Array.isArray(d[k])) d[k] = []; });
    if(!d.profile) d.profile = {};
    if(!d.audit) d.audit = [];
    if(!d.readNotifs) d.readNotifs = [];
    if(!d.cloud) d.cloud = { lastPush:null, lastPull:null, autoSync:true, sheet:'Resume', key:'' };
    if(d.cloud.autoSync === undefined || d.cloud.autoSync === null) d.cloud.autoSync = true;
    return d;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }

function renderSidebar(){

      <div><h2>${esc(L('app.name'))}</h2><p>${esc(L('app.tagline'))}</p></div>

  NAV.forEach(item=>{
    if(item.group){ html += `<div class="nav-group">${esc(L(item.group))}</div>`; return; }
    if(!canSee(item)) return;
    const active = state.view===item.id ? ' active' : '';
    let badge = '';
    if(item.id==='notifications' && unread) badge = `<span class="badge">${unread}</span>`;
    if(item.id==='quality'){ const n = qualityIssues().total; if(n) badge = `<span class="badge">${n}</span>`; }
    html += `<button class="nav-item${active}" onclick="go('${item.id}')">
        <span class="ic">${item.icon}</span><span>${esc(L(item.label))}</span>${badge}
      </button>`;
  });
  html += `</nav>`;
  $('#sidebar').innerHTML = html;
}

}

function count(k){ return (DB[k]||[]).length; }
function totalGrants(){ return (DB.grants||[]).reduce((s,g)=>s+Number(g.amount||0),0); }

function profileCompleteness(){
  const p = DB.profile;
  const keys = ['name','title','position','faculty','campus','department','email','officeTel','officeLoc','photo',
                'orcid','scopus','shortBio','expertise','researchInterest','keywords','sdg'];
  const filled = keys.filter(k=>p[k] && String(p[k]).trim()).length;
  return Math.round(filled/keys.length*100);
}

function pubByYear(){
  const m = {};
  (DB.publications||[]).forEach(p=>{ const y = p.year||'—'; m[y]=(m[y]||0)+1; });
  return m;
}
function quartileCount(q){ return (DB.publications||[]).filter(p=>p.quartile===q).length; }
function indexingCount(i){ return (DB.publications||[]).filter(p=>p.indexing===i).length; }

function findDuplicates(){
  const map = {};
  (DB.publications||[]).forEach(p=>{
    const k = (p.title||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,45);
    if(!k) return;
    (map[k] = map[k]||[]).push(p);
  });
  return Object.values(map).filter(a=>a.length>1);
}
function qualityIssues(){
  const pubs = DB.publications||[];
  const missingDOI = pubs.filter(p=>!p.doi).length;
  const missingYear = pubs.filter(p=>!p.year).length;
  const noOrcid = DB.profile.orcid ? 0 : 1;
  const dup = findDuplicates().length;
  return { missingDOI, missingYear, noOrcid, dup, total: missingDOI + missingYear + noOrcid + dup };
}
function notifications(){
  const q = qualityIssues();
  const list = [];
  const isMs = LANG === 'ms';
  if(q.missingDOI) list.push({id:'n-doi',icon:'🔍',tone:'amber',
    title: isMs ? `${q.missingDOI} penerbitan tiada DOI` : `${q.missingDOI} publication(s) missing DOI`,
    desc: isMs ? 'Lengkapkan DOI untuk pengindeksan yang lebih baik.' : 'Complete DOI for better indexing.'});
  if(q.noOrcid) list.push({id:'n-orcid',icon:'🆔',tone:'amber',
    title: isMs ? 'Profil tiada ORCID' : 'Profile missing ORCID',
    desc: isMs ? 'Tambah ORCID untuk penyegerakan penulis.' : 'Add ORCID for author synchronisation.'});
  if(q.dup) list.push({id:'n-dup',icon:'⚠️',tone:'red',
    title: isMs ? 'Kemungkinan penerbitan bertindih' : 'Possible duplicate publication detected',
    desc: isMs ? 'Sistem mengesan rekod yang mungkin bertindih.' : 'The system detected records that may overlap.'});
  const pc = profileCompleteness();
  if(pc < 100) list.push({id:'n-prof',icon:'👤',tone:'sky',
    title: isMs ? `Profil anda ${pc}% lengkap` : `Your profile is ${pc}% complete`,
    desc: isMs ? 'Lengkapkan maklumat untuk CV yang lebih baik.' : 'Complete the information for a better CV.'});
  list.push({id:'n-cv',icon:'📄',tone:'green',
    title: isMs ? 'Templat CV sedia' : 'CV template ready',
    desc: isMs ? 'CV akademik anda boleh dijana pada bila-bila masa.' : 'Your academic CV can be generated anytime.'});
  if(DB.cloud && DB.cloud.lastPush) list.push({id:'n-cloud',icon:'☁️',tone:'green',
    title: isMs ? 'Auto cloud sync aktif' : 'Auto cloud sync active',
    desc: (isMs?'Kali terakhir hantar: ':'Last push: ') + fmtDateTime(DB.cloud.lastPush)});
  return list;
}
function log(action, target, source, extra){
  DB.audit.unshift({
    id: uid(), who: DB.profile.name || CURRENT_USER.name,
    action, target, source: source || 'Manual Entry',
    date: new Date().toISOString(),
    confidence: extra && extra.confidence ? extra.confidence : null,
    verified: extra && extra.verified !== undefined ? extra.verified : true
  });
  if(DB.audit.length > 300) DB.audit.length = 300;
}

/* =========================================================
   SYNC ENGINE
   ========================================================= */
const SYNC = {
  timer:null, inflight:false, retries:0,
  maxRetries:6, debounceMs:600,
  status:'idle', lastReason:'change', queue:0, dirty:false,

  markDirty(){ SYNC.dirty = true; },

  schedule(reason){
    SYNC.dirty = true;
    SYNC.lastReason = reason || SYNC.lastReason || 'change';
    SYNC.queue++;
    if(!DB.cloud.autoSync){ SYNC.setStatus('idle'); return; }
    if(!navigator.onLine){ SYNC.setStatus('offline'); return; }
    clearTimeout(SYNC.timer);
    SYNC.setStatus('pending');
    SYNC.timer = setTimeout(()=>SYNC.flush(SYNC.lastReason), SYNC.debounceMs);
  },

  async flush(reason){
    if(SYNC.inflight){ setTimeout(()=>SYNC.flush(reason), 500); return false; }
    if(!navigator.onLine){ SYNC.setStatus('offline'); return false; }
    clearTimeout(SYNC.timer);
    SYNC.inflight = true;
    SYNC.setStatus('busy');
    const ok = await cloudPush({ silent:true, reason });
    SYNC.inflight = false;
    if(ok){
      SYNC.retries = 0; SYNC.queue = 0; SYNC.dirty = false;
      SYNC.setStatus('ok');
      return true;
    }
    SYNC.retries++;
    if(SYNC.retries <= SYNC.maxRetries){
      const wait = Math.min(2000 * SYNC.retries, 15000);
      SYNC.setStatus('retry');
      setTimeout(()=>SYNC.flush(reason + '-retry' + SYNC.retries), wait);
    } else {
      SYNC.setStatus('error');
      setTimeout(()=>{ SYNC.retries=0; SYNC.flush('recover'); }, 45000);
    }
    return false;
  },

  setStatus(s){
    SYNC.status = s;
    const dot = document.getElementById('syncDot');
    const lbl = document.getElementById('syncLabel');
    if(dot && lbl){
      const map  = { idle:'off', pending:'busy', busy:'busy', ok:'on', error:'off', offline:'off', retry:'busy' };
      dot.className = 'sync-dot ' + (map[s]||'off');
      lbl.textContent = L('sync.'+s, s);
    }
    // === UPLOAD cloud indicator animation ===
    try{
      if(s === 'busy' || s === 'pending' || s === 'retry')      UPLOAD_INDICATOR.start();
      else if(s === 'ok')                                       UPLOAD_INDICATOR.done();
      else if(s === 'error')                                    UPLOAD_INDICATOR.error();
      else if(s === 'offline')                                  UPLOAD_INDICATOR.offline();
      else if(s === 'idle')                                     UPLOAD_INDICATOR.idle();
    }catch(e){}
  },

  flushKeepalive(){
    try{
      if(!DB.cloud.autoSync || !navigator.onLine) return;
      if(!SYNC.dirty && !SYNC.timer && SYNC.queue===0) return;
      const full = buildCloudPayload();
      let body = JSON.stringify(full);
      if(body.length > 60000){
        const minimal = {
          action:'updateResume', timestamp:new Date().toISOString(),
          source:'Academic Profile System (beacon-minimal)',
          key: DB.cloud.key || '', sheet: DB.cloud.sheet || 'Resume',
          auth:{ userId:CURRENT_USER.id, name:CURRENT_USER.name, email:CURRENT_USER.email, role:CURRENT_ROLE },
          profile: DB.profile,
          summary:{ publications:(DB.publications||[]).length, completeness: profileCompleteness() },
          data:{ publications: DB.publications||[], grants: DB.grants||[], projects: DB.projects||[],
                 awards: DB.awards||[], conferences: DB.conferences||[], supervision: DB.supervision||[] }
        };
        body = JSON.stringify(minimal);
      }
      fetch(CLOUD_URL, {
        method:'POST', keepalive:true,
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body, redirect:'follow'
      }).catch(()=>{});
      if(navigator.sendBeacon){
        try{ navigator.sendBeacon(CLOUD_URL, new Blob([body], {type:'text/plain;charset=utf-8'})); }catch(e){}
      }
      SYNC.dirty = false;
    }catch(e){}
  }
};
window.SYNC = SYNC;

  if(!el || !el.dataset) return;

  if(el.dataset.e){ DB.profile[el.dataset.e] = el.value; changed = true; }
  if(changed){ save(); SYNC.markDirty(); }
}, true);

  const el = e.target;
  if(!el || !el.dataset) return;
  if(el.readOnly) return;
  if(el.dataset.p || el.dataset.e){
    log('Auto-saved field', el.dataset.p || el.dataset.e, 'Auto-save');
    SYNC.schedule('on-blur');
  }
}, true);

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && (SYNC.timer || SYNC.queue>0 || SYNC.dirty)){
    clearTimeout(SYNC.timer);
    SYNC.flushKeepalive();
    SYNC.flush('visibility-hidden');
  }
});
window.addEventListener('pagehide', ()=>{ SYNC.flushKeepalive(); });
window.addEventListener('online',  ()=>{ toast(L('toast.online')); SYNC.flush('online'); });
window.addEventListener('offline', ()=>{ SYNC.setStatus('offline'); toast(L('toast.offline')); });

setInterval(()=>{
  if(DB.cloud.autoSync && navigator.onLine &&
     SYNC.status !== 'ok' && SYNC.status !== 'busy' && SYNC.status !== 'pending'){
    SYNC.flush('periodic');
  }
}, 3*60*1000);

let _logoutBypass = false;
let _allowExit = false;
let _exitGuardShown = false;

function hasUnsavedCloudChanges(){
  return SYNC.dirty || SYNC.timer || SYNC.queue > 0 || SYNC.status === 'pending' || SYNC.status === 'busy' || SYNC.status === 'retry';
}

function doLogout(){
  if(!hasUnsavedCloudChanges()){
    _logoutBypass = true; _allowExit = true;
    try { FMSAuth.clearSession(); } catch(e){}
    window.location.href = 'login.html';
    return;
  }
  $('#logoutRoot').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeLogoutModal()">
    <div class="modal" style="max-width:560px">
      <div class="modal-head">
        <div style="font-size:22px">⚠️</div>
        <h3>${esc(L('logout.confirm.title'))}</h3>
        <button type="button" class="btn btn-sm" style="margin-left:auto" onclick="closeLogoutModal()">${esc(L('btn.close'))}</button>
      </div>
      <div class="modal-body">
        <div class="hint warn">${L('logout.confirm.desc')}</div>
        <p style="margin-top:14px;font-size:13px">${L('logout.confirm.instruction')}</p>
        <div id="logoutProgress" class="logout-progress" style="display:none"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" onclick="closeLogoutModal()">${esc(L('btn.cancel'))}</button>
        <button type="button" class="btn btn-danger" onclick="forceLogout()">${esc(L('btn.logoutOnly'))}</button>
        <button type="button" class="btn btn-ok" id="btnUpdateAndLogout" onclick="syncAndLogout()">${esc(L('btn.updateLogout'))}</button>
      </div>
    </div>
  </div>`;
}
window.doLogout = doLogout;
function closeLogoutModal(){ $('#logoutRoot').innerHTML = ''; }
window.closeLogoutModal = closeLogoutModal;

async function syncAndLogout(){
  const btn = document.getElementById('btnUpdateAndLogout');
  const prog = document.getElementById('logoutProgress');
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${esc(L('logout.sendingBtn'))}`; }
  if(prog){ prog.style.display='block'; prog.className='logout-progress'; prog.innerHTML = L('logout.sending'); }
  try{
    clearTimeout(SYNC.timer); SYNC.queue = 0;
    const ok = await cloudPush({ silent:true, reason:'logout' });
    if(ok){
      if(prog){ prog.className='logout-progress done'; prog.innerHTML = L('logout.sent'); }
      SYNC.dirty = false;
      setTimeout(()=>forceLogout(), 900);
    } else {
      if(prog){ prog.className='logout-progress err'; prog.innerHTML = L('logout.failed'); }
      if(btn){ btn.disabled = false; btn.innerHTML = esc(L('logout.retryBtn')); }
    }
  }catch(err){
    if(prog){ prog.className='logout-progress err'; prog.innerHTML = `❌ ${esc(err.message)}`; }
    if(btn){ btn.disabled = false; btn.innerHTML = esc(L('logout.retryBtn')); }
  }
}
window.syncAndLogout = syncAndLogout;

function forceLogout(){
  _logoutBypass = true; _allowExit = true;
  closeLogoutModal();
  try { FMSAuth.clearSession(); } catch(e){}
  window.location.href = 'login.html';
}
window.forceLogout = forceLogout;

function showExitGuardModal(reason){
  if(_exitGuardShown) return;
  _exitGuardShown = true;
  const reasonText = reason === 'back'  ? L('logout.exitBack')
                   : reason === 'close' ? L('logout.exitClose')
                   : L('logout.exitRefresh');
  $('#logoutRoot').innerHTML = `
  <div class="modal-bg" onclick="event.stopPropagation()">
    <div class="modal" style="max-width:560px">
      <div class="modal-head">
        <div style="font-size:22px">🛑</div>
        <h3>${esc(L('logout.exitTitle'))}</h3>
      </div>
      <div class="modal-body">
        <div class="hint warn">${L('logout.exitDesc').replace('{reason}', reasonText)}</div>
        <p style="margin-top:14px;font-size:13px">${L('logout.exitInstruction')}</p>
        <div id="exitGuardProgress" class="logout-progress" style="display:none"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" onclick="cancelExitGuard()">${esc(L('btn.stay'))}</button>
        <button type="button" class="btn btn-ok" id="btnExitUpdate" onclick="syncThenExit()">${esc(L('btn.updateExit'))}</button>
      </div>
    </div>
  </div>`;
}
function cancelExitGuard(){ _exitGuardShown = false; $('#logoutRoot').innerHTML = ''; }
window.cancelExitGuard = cancelExitGuard;

async function syncThenExit(){
  const btn  = document.getElementById('btnExitUpdate');
  const prog = document.getElementById('exitGuardProgress');
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${esc(L('logout.sendingShort'))}`; }
  if(prog){ prog.style.display='block'; prog.className='logout-progress'; prog.innerHTML = L('logout.sending'); }
  try{
    clearTimeout(SYNC.timer); SYNC.queue = 0;
    const ok = await cloudPush({ silent:true, reason:'exit-guard' });
    if(ok){
      SYNC.dirty = false; SYNC.setStatus('ok');
      if(prog){ prog.className='logout-progress done'; prog.innerHTML = L('logout.exitSent'); }
      setTimeout(() => {
        _exitGuardShown = false; _allowExit = true;
        $('#logoutRoot').innerHTML = '';
        toast(L('logout.exitDone'));
      }, 1200);
    } else {
      if(prog){ prog.className='logout-progress err'; prog.innerHTML = L('logout.failed'); }
      if(btn){ btn.disabled = false; btn.innerHTML = esc(L('btn.tryAgain')); }
    }
  } catch(err){
    if(prog){ prog.className='logout-progress err'; prog.innerHTML = `❌ ${esc(err.message)}`; }
    if(btn){ btn.disabled = false; btn.innerHTML = esc(L('btn.tryAgain')); }
  }
}
window.syncThenExit = syncThenExit;

(function trapBack(){
  try{ history.pushState(null, '', location.href); }catch(e){}
  window.addEventListener('popstate', () => {
    if(_allowExit || _logoutBypass) return;
    if(hasUnsavedCloudChanges()){
      try{ history.pushState(null, '', location.href); }catch(e){}
      showExitGuardModal('back');
    } else {
      _allowExit = true;
      try{ history.back(); }catch(e){}
    }
  });
})();

window.addEventListener('beforeunload', (e) => {
  if(_allowExit || _logoutBypass) return;
  if(hasUnsavedCloudChanges()){
    SYNC.flushKeepalive();
    e.preventDefault();
    const msg = LANG === 'ms'
      ? 'Data belum disegerakkan ke Google Sheets. Sila tekan "Update Resume" dahulu.'
      : 'Data has not been synced to Google Sheets. Please press "Update Resume" first.';
    e.returnValue = msg;
    return msg;
  }
});

function cloudSummary(){
  return { publications: count('publications'), totalGrants: totalGrants(), awards: count('awards') };
}

function syncLog(msg, cls){
  const el = document.getElementById('syncLog');
  if(!el) return;
  const tt = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.innerHTML = `<span class="t">[${tt}]</span> <span class="${cls||''}">${msg}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function buildCloudPayload(){
  return {
    action: 'updateResume',
    timestamp: new Date().toISOString(),
    source: 'Academic Profile System',
    lang: LANG,
    key: DB.cloud.key || '',
    sheet: DB.cloud.sheet || 'Resume',
    auth: { userId: CURRENT_USER.id, name: CURRENT_USER.name, email: CURRENT_USER.email, role: CURRENT_ROLE },
    profile: DB.profile,
    summary: {
      publications: (DB.publications||[]).length, grants: (DB.grants||[]).length,
      totalGrants: totalGrants(), projects: (DB.projects||[]).length,
      awards: (DB.awards||[]).length, completeness: profileCompleteness()
    },
    cvHtml: (function(){
      try {
        let el = document.getElementById('cvDoc');
        let created = false;
        if(!el){ el = document.createElement('div'); el.id='cvDoc'; el.style.display='none'; document.body.appendChild(el); created=true; }
        const prev = el.innerHTML;
        generateCV();
        const html = el.innerHTML;
        if(created){ el.remove(); } else { el.innerHTML = prev; }
        return html;
      } catch(e){ return ''; }
    })(),
    data: {
      qualifications: DB.qualifications||[], teaching: DB.teaching||[], projects: DB.projects||[],
      grants: DB.grants||[], publications: DB.publications||[], conferences: DB.conferences||[],
      books: DB.books||[], awards: DB.awards||[], media: DB.media||[], adminExp: DB.adminExp||[],
      supervision: DB.supervision||[], consultancy: DB.consultancy||[], memberships: DB.memberships||[],
      community: DB.community||[], innovation: DB.innovation||[], ip: DB.ip||[]
    }
  };
}

async function cloudPost(payload){
  const body = JSON.stringify(payload);
  try {
    const res = await fetch(CLOUD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body, redirect: 'follow'
    });
    const text = await res.text();
    let json = null; try { json = JSON.parse(text); } catch(e){}
    return { ok: res.ok, status: res.status, text, json, opaque:false };
  } catch(err) {
    try {
      await fetch(CLOUD_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body, redirect: 'follow'
      });
      return { ok: true, status: 0, text: '(opaque — CORS blocked response)', json:null, opaque:true };
    } catch(err2){
      return { ok: false, status: 0, text: err2.message, json:null, error:true };
    }
  }
}

function setBusy(id, busy, label){
  const b = document.getElementById(id);
  if(!b) return;
  if(busy){ b.dataset.label = b.innerHTML; b.disabled = true; b.innerHTML = `<span class="spin"></span> ${label||'Processing…'}`; }
  else { b.disabled = false; if(b.dataset.label) b.innerHTML = b.dataset.label; }
}

async function cloudTest(){
  setBusy('btnTest', true, 'Testing…');
  syncLog('🔌 Testing connection…','in');
  try{
    const url = CLOUD_URL + '?action=ping&t=' + Date.now();
    const res = await fetch(url, { method:'GET', redirect:'follow' });
    const text = await res.text();
    syncLog(`✅ Connection OK (HTTP ${res.status}). ${esc(text.slice(0,120))}`,'ok');
    toast(L('toast.testOK'));
  }catch(err){
    syncLog(`❌ Failed: ${esc(err.message)}`,'er');
    syncLog('💡 Check: Deploy → Execute as "Me", Who has access "Anyone".','t');
    toast(L('toast.testFail'));
  }finally{ setBusy('btnTest', false); }
}
window.cloudTest = cloudTest;

async function cloudPush(opts){
  opts = opts || {};
  const silent = !!opts.silent;
  if(!silent) setBusy('btnPush', true, 'Uploading…');
  syncLog(`⬆ Push${opts.reason?' ('+opts.reason+')':''}…`,'in');
  const payload = buildCloudPayload();
  syncLog(`📦 Payload: ${(JSON.stringify(payload).length/1024).toFixed(1)} KB`,'t');
  try{
    const r = await cloudPost(payload);
    if(r.ok){
      DB.cloud.lastPush = new Date().toISOString();
      log('Cloud Sync — Pushed', DB.profile.name||'Profile', 'Cloud Sync', { confidence:100, verified:true });
      save();
      syncLog(r.opaque
        ? '✅ Push successful (opaque response).'
        : `✅ Success. ${esc((r.text||'').slice(0,160))}`,'ok');
      if(!silent) toast(L('toast.synced'));
      if(state.view==='cloudSync') render(); else renderSidebar();
      return true;
    } else {
      syncLog(`❌ HTTP ${r.status}: ${esc((r.text||'').slice(0,200))}`,'er');
      if(!silent) toast(L('toast.syncFailed'));
      return false;
    }
  }catch(err){
    syncLog(`❌ Error: ${esc(err.message)}`,'er');
    if(!silent) toast(L('toast.syncFailed'));
    return false;
  }finally{
    if(!silent) setBusy('btnPush', false);
  }
}
window.cloudPush = cloudPush;

async function quickCloudPush(){
  toast(L('toast.syncing'));
  clearTimeout(SYNC.timer);
  const ok = await SYNC.flush('manual-force');
  toast(ok ? L('toast.synced') : L('toast.syncFailed'));
}
window.quickCloudPush = quickCloudPush;

async function cloudPull(){
  setBusy('btnPull', true, 'Pulling…');
  syncLog('⬇ Pulling…','in');
  DOWNLOAD_INDICATOR.startFromZero();
  try{
    const url = CLOUD_URL + '?action=getResume&userId=' + encodeURIComponent(CURRENT_USER.id) +
                '&key=' + encodeURIComponent(DB.cloud.key||'') + '&t=' + Date.now();
    const res = await fetch(url, { method:'GET', redirect:'follow' });
    const text = await res.text();
    let json = null; try { json = JSON.parse(text); } catch(e){}
    if(!json){
      syncLog(`⚠️ Not JSON: ${esc(text.slice(0,200))}`,'er');
      toast(L('toast.pullFailed'));
      DOWNLOAD_INDICATOR.error();
      return;
    }
    const incoming = json.data || json.profile || json;
    if(incoming.profile && confirm(L('confirm.replaceProfile'))){
      const d = authDerivedProfile();
      DB.profile = { ...DB.profile, ...incoming.profile };
      DB.profile.name     = d.name     || DB.profile.name;
      DB.profile.staffId  = d.staffId  || DB.profile.staffId;
      DB.profile.position = d.position || DB.profile.position;
    }
    Object.keys(SCHEMA).forEach(k=>{ if(Array.isArray(incoming[k])) DB[k] = incoming[k]; });
    DB.cloud.lastPull = new Date().toISOString();
    log('Cloud Sync — Pulled', DB.profile.name||'Profile', 'Cloud Sync');
    save(); render();
    syncLog('✅ Data pulled.','ok');
    toast(L('toast.pullSuccess'));
    DOWNLOAD_INDICATOR.done();
  }catch(err){
    syncLog(`❌ ${esc(err.message)}`,'er');
    toast(L('toast.pullFailed'));
    DOWNLOAD_INDICATOR.error();
  }finally{ setBusy('btnPull', false); }
}
window.cloudPull = cloudPull;

function generateCV(){
  let chosen = [...document.querySelectorAll('.cv-sec:checked')].map(c=>c.value);
  if(chosen.length === 0){
    chosen = ['profile','qualifications','expertise','teaching','projects','grants',
              'publications','conferences','books','awards','supervision','consultancy',
              'adminExp','memberships','community','innovation','ip'];
  }
  const p = DB.profile;
  let h = `
  <div style="text-align:center;border-bottom:3px solid #4f46e5;padding-bottom:14px;margin-bottom:6px">
    <h1>${esc(p.title||'')} ${esc(p.name||'')}</h1>
    <div style="font-weight:600;color:#4f46e5">${esc(p.position||'')} · ${esc(p.faculty||'')}</div>
    <div style="font-size:12px;color:#4b5563;margin-top:6px">
      ${esc(p.email||'')} ${p.officeTel?' · '+esc(p.officeTel):''} ${p.officeLoc?' · '+esc(p.officeLoc):''}
    </div>
    <div style="font-size:12px;color:#4b5563">
      ${p.orcid?'ORCID: '+esc(p.orcid):''} ${p.scopus?' · Scopus: '+esc(p.scopus):''} ${p.wos?' · WoS: '+esc(p.wos):''}
    </div>
  </div>`;

  if(chosen.includes('profile')) h += `<h2>Profile</h2><p>${esc(p.shortBio||p.longBio||'—')}</p>`;
  if(chosen.includes('expertise')) h += `<h2>Expertise &amp; Research Interest</h2>
      <p><b>Expertise:</b> ${esc(p.expertise||'—')}</p>
      <p><b>Research Interest:</b> ${esc(p.researchInterest||'—')}</p>
      <p><b>Keywords:</b> ${esc(p.keywords||'—')}</p>
      <p><b>SDG:</b> ${esc(p.sdg||'—')}</p>`;
  if(chosen.includes('qualifications')){
    h += `<h2>Academic Qualification</h2>`;
    sortBy('qualifications','gradYear').forEach(q=>{
      h += `<div class="cvitem"><b>${esc(q.qualification||'')}${q.field?' in '+esc(q.field):''}</b> — ${esc(q.university||'')} (${esc(q.gradYear||'')})
        ${q.thesis?`<br><i>Thesis: ${esc(q.thesis)}</i>`:''}</div>`;
    });
  }
  if(chosen.includes('teaching')){

function sortBy(key, dateKey){
  return [...(DB[key]||[])].sort((a,b)=> String(b[dateKey]||'').localeCompare(String(a[dateKey]||'')));
}

function downloadCV(){
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>CV - ${esc(DB.profile.name)}</title>
  <style>body{font-family:Georgia,serif;max-width:820px;margin:40px auto;padding:0 30px;color:#111;font-size:13px;line-height:1.6}
  h1{font-size:26px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:#4f46e5;border-bottom:2px solid #e5e9f2;padding-bottom:5px;margin:22px 0 10px}
  .cvitem{margin-bottom:10px}</style></head><body>${$('#cvDoc').innerHTML}</body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CV_' + (DB.profile.name||'profile').replace(/\s+/g,'_') + '.html';
  a.click();
  toast(L('toast.cvDownloaded'));
}

function doSearch(){
  const q = ($('#sq').value||'').trim().toLowerCase();
  state.q = q;
  if(!q){ $('#searchRes').innerHTML = ''; return; }
  const p = DB.profile;
  const hit = (txt) => String(txt||'').toLowerCase().includes(q);
  const matches = [];
  if(hit(p.expertise)) matches.push(['Expertise', p.expertise]);
  if(hit(p.researchInterest)) matches.push(['Research Interest', p.researchInterest]);
  if(hit(p.keywords)) matches.push(['Keywords', p.keywords]);
  const rel = k => (DB[k]||[]).filter(r => JSON.stringify(r).toLowerCase().includes(q));
  const pubs = rel('publications'), projs = rel('projects'), grants = rel('grants'),
        teach = rel('teaching'), innov = rel('innovation'), comm = rel('community');
  const total = pubs.length + projs.length + grants.length + teach.length + innov.length + comm.length + matches.length;

  $('#searchRes').innerHTML = `
  <div class="card card-pad" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-size:36px">${esc(p.photo||'👤')}</div>
      <div style="flex:1">
        <div style="font-weight:800;font-size:16px">${esc(p.title||'')} ${esc(p.name||'')}</div>
        <div class="muted small">${esc(p.position||'')} · ${esc(p.faculty||'')}</div>
      </div>
      <span class="pill ${total?'green':'gray'}">${total} ${esc(L('search.matches'))}</span>
      <button class="btn btn-sm" onclick="go('public')">${esc(L('search.viewProfile'))}</button>
    </div>
  </div>

  ${matches.length ? `<div class="card card-pad" style="margin-bottom:16px">
    <div class="section-title">${esc(L('search.expertiseMatch'))}</div>
    ${matches.map(([l,v])=>`<div style="margin-bottom:8px"><span class="pill sky">${l}</span> <span class="small">${esc(v)}</span></div>`).join('')}
  </div>`:''}

  ${resultBlock('📚 Publications', pubs, x=>x.title, x=>`${x.journal||''} · ${x.year||''}`)}
  ${resultBlock('🔬 Research Projects', projs, x=>x.title, x=>`${x.role||''} · ${x.status||''}`)}
  ${resultBlock('💰 Grants', grants, x=>x.grantName, x=>`${x.fundingAgency||''} · ${money(x.amount)}`)}
  ${resultBlock('👨‍🏫 Teaching', teach, x=>x.courseName, x=>`${x.courseCode||''} · ${x.academicYear||''}`)}
  ${resultBlock('💡 Innovation', innov, x=>x.title, x=>`${x.category||''} · ${x.year||''}`)}
  ${resultBlock('🌍 Community', comm, x=>x.programmeName, x=>`${x.organisation||''} · ${x.sdg||''}`)}

  ${total===0 ? `<div class="card"><div class="empty"><div class="big">🤷</div><p>${esc(L('search.noMatch'))} "${esc(q)}".</p></div></div>`:''}`;
}
window.doSearch = doSearch;

function resultBlock(title, arr, tFn, sFn){
  if(!arr.length) return '';
  return `<div class="card card-pad" style="margin-bottom:16px">
    <div class="section-title">${title} <span class="pill gray">${arr.length}</span></div>
    ${arr.slice(0,8).map(x=>`<div style="padding:9px 0;border-bottom:1px solid #f1f5f9">
        <b class="small">${esc(tFn(x)||'')}</b>
        <div class="muted small">${esc(sFn(x))}</div>
      </div>`).join('')}
  </div>`;
}

        </div>
        <div style="flex:1;min-width:160px;background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:14px">

          <div style="font-size:20px;font-weight:800;margin-top:6px">Grants</div>
          <div style="font-size:18px;font-weight:700;color:var(--brand)">${money(gp[prev]||0)} → ${money(gp[last]||0)}</div>
        </div>
      </div>` : `<p class="muted small">${esc(L('kpi.notEnoughData'))}</p>`}
    </div>

    <div class="card card-pad">
      <div class="section-title">${esc(L('kpi.grantByYear'))}</div>
      ${Object.keys(gp).length? Object.entries(gp).sort().map(([y,v])=>`
        <div class="bar-row"><span class="muted">${esc(y)}</span>
          <div class="bar"><i style="width:${pct(v,Math.max(...Object.values(gp)))}%"></i></div>
          <b style="font-size:10.5px">${(v/1000).toFixed(0)}k</b></div>`).join('') : `<p class="muted small">${esc(L('kpi.noData'))}</p>`}
    </div>
  </div>`;
};

VIEWS.quality = function(){
  const q = qualityIssues();
  const dups = findDuplicates();
  const noDoi = (DB.publications||[]).filter(p=>!p.doi);
  const noYear = (DB.publications||[]).filter(p=>!p.year);

  $('#view').innerHTML = `
  <div class="grid g4" style="margin-bottom:18px">
    ${statCard('🔍', q.missingDOI, esc(L('quality.missingDOI')))}
    ${statCard('📅', q.missingYear, esc(L('quality.missingYear')))}
    ${statCard('🆔', q.noOrcid, esc(L('quality.missingORCID')))}
    ${statCard('⚠️', q.dup, esc(L('quality.duplicates')))}
  </div>

  <div class="card card-pad" style="margin-bottom:16px">
    <div class="section-title">${esc(L('quality.missingData'))}</div>
    ${noDoi.length? noDoi.map(p=>`<div style="padding:9px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:10px;align-items:center">
        <span class="small" style="flex:1">${esc(p.title)}</span>
        <span class="pill amber">${esc(L('quality.noDOIpill'))}</span>
        <button class="btn btn-sm" onclick="openForm('publications','${p.id}')">${esc(L('quality.complete'))}</button>
      </div>`).join('') : `<p class="muted small">${esc(L('quality.noDOI'))}</p>`}
    ${noYear.length? `<div style="margin-top:14px">${noYear.map(p=>`<div style="padding:9px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:10px;align-items:center">
        <span class="small" style="flex:1">${esc(p.title)}</span>
        <span class="pill amber">${esc(L('quality.noYearpill'))}</span>
        <button class="btn btn-sm" onclick="openForm('publications','${p.id}')">${esc(L('quality.complete'))}</button>
      </div>`).join('')}</div>`:''}
    ${!DB.profile.orcid ? `<div class="hint warn" style="margin-top:14px">${esc(L('quality.orcidMissing'))} <button class="btn btn-sm" onclick="go('profile')">${esc(L('quality.addOrcid'))}</button></div>`:''}
  </div>

  <div class="card card-pad">
    <div class="section-title">${esc(L('quality.possibleDup'))}</div>
    ${dups.length ? dups.map((group,gi)=>`
      <div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px">
        <div class="pill red" style="margin-bottom:10px">${esc(L('quality.dupPill'))}</div>
        ${group.map(p=>`<div style="padding:7px 0;border-bottom:1px solid #f1f5f9">
            <b class="small">${esc(p.title)}</b>
            <div class="muted small">${esc(p.journal||'')} · ${esc(p.year||'')} · DOI: ${esc(p.doi||'—')}</div>
          </div>`).join('')}
        <div class="btn-row" style="margin-top:12px">
          <button class="btn btn-sm btn-primary" onclick="mergeDup(${gi})">${esc(L('quality.merge'))}</button>
          <button class="btn btn-sm" onclick="toast('${esc(L('confirm.keepSeparate'))}')">${esc(L('quality.keepSeparate'))}</button>
        </div>
      </div>`).join('') : `<p class="muted small">${esc(L('quality.noDup'))}</p>`}
  </div>`;
};

function mergeDup(gi){
  const dups = findDuplicates();
  const group = dups[gi];
  if(!group || group.length<2) return;
  const keep = group[0];
  const dropIds = group.slice(1).map(g=>g.id);
  DB.publications = DB.publications.filter(p=>!dropIds.includes(p.id));
  log('Merged Duplicate', keep.title||'Publication', 'Data Quality');
  save(); render(); toast(L('toast.merged'));
  clearTimeout(SYNC.timer);
  SYNC.flush('after-merge');
}
window.mergeDup = mergeDup;

function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'academic_profile_' + (CURRENT_USER.id||'user') + '_export.json';
  a.click();
  toast(L('toast.exported'));
}
window.exportData = exportData;

function resetAll(){
  if(!confirm(L('confirm.reset'))) return;
  DB = seed(); save(); go('dashboard'); toast(L('toast.dataReset'));
  clearTimeout(SYNC.timer);
  SYNC.flush('after-reset');
}
window.resetAll = resetAll;

/* =========================================================
   INIT
   ========================================================= */
function bootApp(){
  if(!sessionStorage.getItem('apsSignedInLogged')){
    sessionStorage.setItem('apsSignedInLogged','1');
    log('Signed in to portal', CURRENT_USER.name, 'Auth');
    save();
  }
  render();
  SYNC.setStatus(DB.cloud.lastPush ? 'ok' : 'idle');

  // Init both cloud indicators
  UPLOAD_INDICATOR.render();
  DOWNLOAD_INDICATOR.render();

  const hasData = Object.keys(SCHEMA).some(k => (DB[k]||[]).length > 0);
  if(hasData && DB.cloud.autoSync){
    setTimeout(()=>SYNC.schedule('initial-load'), 1000);
  }
}

document.addEventListener('DOMContentLoaded', bootApp);
if(document.readyState !== 'loading') bootApp();
</script>
