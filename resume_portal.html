<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Profile System — AI-Powered</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e9f2;
  --brand:#4f46e5; --brand2:#0ea5e9; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}

.app{display:flex;min-height:100vh}
.sidebar{width:264px;background:#0b1220;color:#cbd5e1;position:fixed;inset:0 auto 0 0;overflow-y:auto;z-index:40;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#1e293b;border-radius:3px}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1e293b}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:18px}
.brand h2{font-size:14px;color:#fff;font-weight:700;letter-spacing:.2px}
.brand p{font-size:11px;color:#64748b}
.nav{padding:10px 10px 30px;flex:1}
.nav-group{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#475569;padding:16px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;color:#cbd5e1;font-size:13px;text-align:left;transition:.15s;margin-bottom:1px}
.nav-item:hover{background:#151f33;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(79,70,229,.9),rgba(14,165,233,.75));color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:700}

.main{margin-left:264px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.topbar p{font-size:12px;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role-sel{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12px;font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative;font-size:16px}
.icon-btn:hover{border-color:#c7d2fe}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff;display:none}
.dot.on{display:block}
.avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.view{padding:24px 26px 60px;flex:1}

.sync-status{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
.sync-status:hover{border-color:#c7d2fe;background:#f8faff}
.sync-status .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sync-status .sync-dot.on{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.sync-status .sync-dot.off{background:#94a3b8}
.sync-status .sync-dot.busy{background:#f59e0b;animation:pulse 1s infinite}
@media(max-width:640px){.sync-status span:last-child{display:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.main{margin-left:0}.view{padding:16px}.topbar{padding:12px 16px}}

.section-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;transition:.15s}
.btn:hover{border-color:#c7d2fe;background:#f8faff}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;box-shadow:0 4px 14px rgba(79,70,229,.28)}
.btn-primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--brand),var(--brand2))}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-ok{background:linear-gradient(135deg,#10b981,#34d399);color:#fff;border:none;box-shadow:0 4px 14px rgba(16,185,129,.28)}
.btn-ok:hover{filter:brightness(1.06);background:linear-gradient(135deg,#10b981,#34d399)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-align:left;transition:.15s;box-shadow:var(--shadow);cursor:pointer;width:100%}
.stat:hover{transform:translateY(-2px);border-color:#c7d2fe}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-1px}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stat .ic{font-size:18px;margin-bottom:6px;display:block}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2ff;color:#4338ca}
.pill.green{background:#dcfce7;color:#15803d}
.pill.amber{background:#fef3c7;color:#b45309}
.pill.red{background:#fee2e2;color:#b91c1c}
.pill.gray{background:#f1f5f9;color:#475569}
.pill.sky{background:#e0f2fe;color:#0369a1}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #f1f5f9;vertical-align:top;font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbff}
.tbl-wrap{overflow-x:auto}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px}

.fld{display:flex;flex-direction:column;gap:5px}
.fld span{font-size:11.5px;font-weight:700;color:#475569}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:.15s;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.fld.full{grid-column:1/-1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;border-radius:18px 18px 0 0}
.modal-head h3{font-size:16px;font-weight:800}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;flex-wrap:wrap}

.ring{position:relative;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),#e2e8f0 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}

.bar-row{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;margin-bottom:9px;font-size:12px}
.bar{height:9px;background:#eef2f7;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand2))}

.drop{border:2px dashed #c7d2fe;border-radius:14px;padding:32px;text-align:center;background:#f8faff;transition:.15s;cursor:pointer}
.drop:hover{background:#eef2ff;border-color:var(--brand)}
.conf{display:flex;align-items:center;gap:8px;min-width:120px}
.conf .cbar{flex:1;height:6px;background:#eef2f7;border-radius:4px;overflow:hidden}
.conf .cbar i{display:block;height:100%;border-radius:4px}
.conf b{font-size:11px;width:34px;text-align:right}
.low{background:#fff7ed !important}

.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.step .num{width:24px;height:24px;border-radius:50%;background:#eef2ff;color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}
.step.done .num{background:var(--ok);color:#fff}

#cvDoc{background:#fff;padding:48px 54px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);max-width:900px;margin:0 auto;font-size:13px;line-height:1.55;color:#111827}
#cvDoc h1{font-size:26px;letter-spacing:-.5px;margin-bottom:2px}
#cvDoc h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--brand);border-bottom:2px solid #e5e9f2;padding-bottom:5px;margin:22px 0 10px;font-weight:800}
#cvDoc .cvitem{margin-bottom:10px}
#cvDoc .cvitem b{font-weight:700}
#cvDoc ul{margin-left:16px}
.sec-pick{display:flex;flex-wrap:wrap;gap:8px}
.sec-pick label{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;cursor:pointer;font-weight:600}
.sec-pick label:hover{border-color:#c7d2fe;background:#f8faff}
.sec-pick input{accent-color:var(--brand)}

.pub-hero{background:linear-gradient(135deg,#4f46e5,#0ea5e9);border-radius:18px;padding:30px;color:#fff;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pub-hero .ph{width:84px;height:84px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:40px;border:2px solid rgba(255,255,255,.35)}
.pub-hero h2{font-size:24px;letter-spacing:-.5px}
.pub-hero p{opacity:.9;font-size:13px}

.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:500}

.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:13px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:300;animation:pop .2s}
.hint{background:#f0f9ff;border:1px solid #bae6fd;color:#075985;padding:12px 14px;border-radius:11px;font-size:12.5px;line-height:1.6}
.hint.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.hint.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.hint.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}

.sync-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-dot.on{background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.18)}
.sync-dot.off{background:#94a3b8}
.sync-dot.busy{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.log{background:#0b1220;color:#cbd5e1;border-radius:10px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;max-height:240px;overflow:auto;line-height:1.7}
.log .t{color:#64748b}
.log .ok{color:#34d399}
.log .er{color:#f87171}
.log .in{color:#38bdf8}

.user-badge{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}
.user-badge:hover{border-color:#c7d2fe;background:#f8faff}
.user-badge .uinfo{display:flex;flex-direction:column;line-height:1.1}
.user-badge .uname{font-size:11px;font-weight:800;color:var(--ink);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.user-badge .urole{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
@media(max-width:640px){.user-badge .uinfo{display:none}}

/* Logout modal specific */
.logout-progress{background:#f8faff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;font-size:12.5px}
.logout-progress.done{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.logout-progress.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}

@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .main{margin:0!important}
  .view{padding:0!important}
  body{background:#fff}
  #cvDoc{border:0;box-shadow:none;padding:0;max-width:none}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Ringkasan profil akademik anda</p>
      </div>
      <div class="tb-right">
        <select class="role-sel" id="roleSelect" onchange="setRole(this.value)">
          <option value="Lecturer">👨‍🏫 Lecturer</option>
          <option value="Head">👨‍💼 Head / Coordinator</option>
          <option value="Admin">🔐 Admin</option>
        </select>
        <div class="sync-status" onclick="go('cloudSync')" title="Auto Cloud Sync Status">
          <span class="sync-dot off" id="syncDot"></span>
          <span id="syncLabel">Cloud idle</span>
        </div>
        <button class="icon-btn" onclick="quickCloudPush()" title="Force Sync Now">☁️</button>
        <button class="icon-btn" onclick="go('notifications')" title="Notifications">🔔<span class="dot" id="notifDot"></span></button>
        <div class="user-badge" onclick="go('profile')" title="Profil Saya">
          <div class="avatar" id="tbAvatar">AR</div>
          <div class="uinfo">
            <span class="uname" id="tbName">—</span>
            <span class="urole" id="tbRole">—</span>
          </div>
        </div>
        <button class="icon-btn" onclick="doLogout()" title="Log Keluar">🚪</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="logoutRoot"></div>

<script src="auth.js"></script>

<script>
/* =========================================================
   AUTH GUARD
   ========================================================= */
const session = (window.FMSAuth && FMSAuth.requireAuth(['academic_staff']));

if (!session) {
  document.body.innerHTML = `
    <div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:#64748b;background:#f4f6fb">
      <div style="text-align:center">
        <div style="font-size:44px">🔒</div>
        <h2 style="color:#0f172a;margin:10px 0 6px">Mengalih ke halaman log masuk…</h2>
        <p style="font-size:13px">Sila tunggu sebentar.</p>
      </div>
    </div>`;
  throw new Error('Unauthenticated — redirecting');
}

['click','keydown','mousemove','scroll'].forEach(evt =>
  document.addEventListener(evt, () => { try { FMSAuth.touch(); } catch(e){} }, { passive:true })
);

const CURRENT_USER = {
  id:       (session.user && session.user.id)       || 'anon',
  name:     (session.user && session.user.name)     || 'User',
  email:    (session.user && session.user.email)    || '',
  position: (session.user && session.user.position) || '',
  unit:     (session.user && session.user.unit)     || ''
};
const CURRENT_ROLE = (session.role || session.userRole || 'academic_staff');

/* =========================================================
   0. HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = v => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = () => Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { try{ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } };
const fmtDateTime = d => { try{ return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return d; } };
const num = n => Number(n||0).toLocaleString('en-MY');
const money = n => 'RM ' + Number(n||0).toLocaleString('en-MY');
const initialsOf = name => String(name||'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || 'U';

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}

/* =========================================================
   0b. CLOUD ENDPOINT
   ========================================================= */
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwTf6R87uxIhon3uB5ZW4E2M3o37J58UMRDu494bBQESo1YmaAT0gPDTnmYgmd4gh2IKg/exec';

/* =========================================================
   1. SCHEMA
   ========================================================= */
const SCHEMA = {
  qualifications:{ label:'Academic Qualification', icon:'🎓', singular:'Qualification', dateKey:'gradYear', cols:['university','gradYear'],
    title:r=>`${r.qualification||''}${r.field?' — '+r.field:''}`,
    fields:[
      {k:'qualification',l:'Qualification',type:'select',opts:['PhD','Master','Bachelor','Diploma','Professional Qualification'],req:true},
      {k:'field',l:'Field of Study'},
      {k:'university',l:'University'},
      {k:'faculty',l:'Faculty'},
      {k:'country',l:'Country'},
      {k:'startYear',l:'Start Year',type:'number'},
      {k:'gradYear',l:'Graduation Year',type:'number'},
      {k:'grade',l:'Grade / CGPA'},
      {k:'supervisor',l:'Supervisor'},
      {k:'specialisation',l:'Specialisation'},
      {k:'thesis',l:'Thesis Title',type:'textarea',full:true}
    ]},

  teaching:{ label:'Teaching', icon:'👨‍🏫', singular:'Course', dateKey:'academicYear', cols:['courseCode','programme','role'],
    title:r=>`${r.courseCode?r.courseCode+' — ':''}${r.courseName||''}`,
    fields:[
      {k:'courseCode',l:'Course Code'},{k:'courseName',l:'Course Name',req:true},
      {k:'programme',l:'Programme'},{k:'programmeCode',l:'Programme Code'},
      {k:'level',l:'Level',type:'select',opts:['Diploma','Degree','Master','PhD']},
      {k:'semester',l:'Semester'},{k:'academicYear',l:'Academic Year'},
      {k:'creditHour',l:'Credit Hour',type:'number'},
      {k:'role',l:'Role',type:'select',opts:['Lecturer','Coordinator','Instructor']},
      {k:'campus',l:'Campus'},
      {k:'mode',l:'Teaching Mode',type:'select',opts:['Face to Face','Online','Hybrid','Blended Learning']},
      {k:'innovation',l:'Teaching Innovation',type:'select',opts:['MOOC','OER','e-Learning','Digital Learning','Teaching Module','Teaching Material','Innovative Teaching','None']}
    ]},

  projects:{ label:'Research Project', icon:'🔬', singular:'Project', dateKey:'startDate', cols:['grantType','role','status'],
    title:r=>r.title,
    fields:[
      {k:'title',l:'Project Title',req:true,full:true},
      {k:'acronym',l:'Project Acronym'},
      {k:'grantType',l:'Grant Type'},
      {k:'grantNumber',l:'Grant Number'},
      {k:'fundingAgency',l:'Funding Agency'},
      {k:'totalFunding',l:'Total Funding (RM)',type:'number'},
      {k:'startDate',l:'Start Date',type:'date'},
      {k:'endDate',l:'End Date',type:'date'},
      {k:'status',l:'Project Status',type:'select',opts:['Active','Completed','Pending','Terminated']},
      {k:'role',l:'Role',type:'select',opts:['Principal Investigator','Co-Researcher','Research Member']},

const LS_KEY = 'academic_profile_system_v2_' + (CURRENT_USER.id || 'anon');
let DB;

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    Object.keys(SCHEMA).forEach(k => { if(!Array.isArray(d[k])) d[k] = []; });
    if(!d.profile) d.profile = {};
    if(!d.audit) d.audit = [];
    if(!d.readNotifs) d.readNotifs = [];
    if(!d.cloud) d.cloud = { lastPush:null, lastPull:null, autoSync:true, sheet:'Resume', key:'' };
    if(d.cloud.autoSync === undefined || d.cloud.autoSync === null) d.cloud.autoSync = true;
    return d;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
DB = load() || seed();

function count(k){ return (DB[k]||[]).length; }
function totalGrants(){ return (DB.grants||[]).reduce((s,g)=>s+Number(g.amount||0),0); }

function profileCompleteness(){
  const p = DB.profile;
  const keys = ['name','title','position','faculty','campus','department','email','officeTel','officeLoc','photo',
                'orcid','scopus','shortBio','expertise','researchInterest','keywords','sdg'];
  const filled = keys.filter(k=>p[k] && String(p[k]).trim()).length;
  return Math.round(filled/keys.length*100);
}

function pubByYear(){
  const m = {};
  (DB.publications||[]).forEach(p=>{ const y = p.year||'—'; m[y]=(m[y]||0)+1; });
  return m;
}
function quartileCount(q){ return (DB.publications||[]).filter(p=>p.quartile===q).length; }
function indexingCount(i){ return (DB.publications||[]).filter(p=>p.indexing===i).length; }

function findDuplicates(){
  const map = {};
  (DB.publications||[]).forEach(p=>{
    const k = (p.title||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,45);
    if(!k) return;
    (map[k] = map[k]||[]).push(p);
  });
  return Object.values(map).filter(a=>a.length>1);
}

function qualityIssues(){
  const pubs = DB.publications||[];
  const missingDOI = pubs.filter(p=>!p.doi).length;
  const missingYear = pubs.filter(p=>!p.year).length;
  const noOrcid = DB.profile.orcid ? 0 : 1;
  const dup = findDuplicates().length;
  const incomplete = 100 - profileCompleteness() > 0 ? 1 : 0;
  return { missingDOI, missingYear, noOrcid, dup, incomplete, total: missingDOI + missingYear + noOrcid + dup };
}

function notifications(){
  const q = qualityIssues();
  const list = [];
  if(DB.role==='Admin' || DB.role==='Head'){
    list.push({id:'n-ai', icon:'🤖', title:'AI extraction completed', desc:'3 rekod baharu telah diekstrak dan menunggu pengesahan.', tone:'sky'});
  }
  if(q.missingDOI) list.push({id:'n-doi', icon:'🔍', title:`${q.missingDOI} publication(s) missing DOI`, desc:'Lengkapkan DOI untuk pengindeksan yang lebih baik.', tone:'amber'});
  if(q.noOrcid) list.push({id:'n-orcid', icon:'🆔', title:'Profile missing ORCID', desc:'Tambah ORCID untuk penyegerakan penulis.', tone:'amber'});
  if(q.dup) list.push({id:'n-dup', icon:'⚠️', title:'Possible duplicate publication detected', desc:'Sistem mengesan rekod yang mungkin bertindih.', tone:'red'});
  const pc = profileCompleteness();
  if(pc < 100) list.push({id:'n-prof', icon:'👤', title:`Your profile is ${pc}% complete`, desc:'Lengkapkan maklumat untuk CV yang lebih baik.', tone:'sky'});
  list.push({id:'n-cv', icon:'📄', title:'CV template ready', desc:'Academic CV anda boleh dijana pada bila-bila masa.', tone:'green'});
  if(DB.cloud && DB.cloud.lastPush) list.push({id:'n-cloud', icon:'☁️', title:'Auto cloud sync aktif', desc:'Kali terakhir hantar: ' + fmtDateTime(DB.cloud.lastPush), tone:'green'});
  return list;
}

function log(action, target, source, extra){
  DB.audit.unshift({
    id: uid(),
    who: DB.profile.name || CURRENT_USER.name,
    action, target, source: source || 'Manual Entry',
    date: new Date().toISOString(),
    confidence: extra && extra.confidence ? extra.confidence : null,
    verified: extra && extra.verified !== undefined ? extra.verified : true
  });
  if(DB.audit.length > 300) DB.audit.length = 300;
}

function barChart(map){
  const entries = Object.entries(map).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  if(!entries.length) return '<p class="muted small">Tiada data.</p>';
  const max = Math.max(...entries.map(e=>e[1]));
  return entries.map(([k,v])=>`
    <div class="bar-row">
      <span class="muted">${esc(k)}</span>
      <div class="bar"><i style="width:${(v/max*100)}%"></i></div>
      <b style="text-align:right">${v}</b>
    </div>`).join('');
}

  const f = sch.fields.find(x=>x.k===key);

function cellVal(sch, key, r){
  let v = r[key];
  if(v==null || v==='') return '<span class="muted">—</span>';
  if(key==='amount' || key==='value') return money(v);
  if(key==='quartile' || key==='level' || key==='status' || key==='indexing') {
    const cls = /Q1|International|Active|Completed|Scopus/.test(v) ? 'green' : /Q4|Pending|Withdrawn/.test(v) ? 'amber' : 'gray';
    return `<span class="pill ${cls}">${esc(v)}</span>`;
  }
  return esc(v);
}

function submitForm(e, key, id){
  e.preventDefault();
  const form = e.target;
  const data = { id: id || uid() };
  new FormData(form).forEach((v,k)=>{ data[k] = typeof v === 'string' ? v.trim() : v; });

  if(id){
    const i = DB[key].findIndex(r=>r.id===id);
    DB[key][i] = data;
    log('Updated Record', SCHEMA[key].title(data)||key, 'Manual Entry');
  } else {
    DB[key].push(data);
    log('Added Record', SCHEMA[key].title(data)||key, 'Manual Entry');
  }
  closeModal(); save(); render(); toast('Rekod disimpan ✔ — sync…');
  clearTimeout(SYNC.timer);
  SYNC.flush('after-save');
}

function handleFile(input){
  const file = input.files[0];
  if(!file) return;
  if(/\.(txt|md|csv|json)$/i.test(file.name) || file.type.startsWith('text')){
    const fr = new FileReader();
    fr.onload = e => { $('#scanText').value = e.target.result; toast('Fail dibaca ✔'); };

function detectType(text){
  const t = text.toLowerCase();
  if(/appointment|lantikan|letter of appointment/.test(t)) return 'adminExp';
  if(/grant|funding agency|grant number|rm\s?\d/.test(t)) return 'grants';
  if(/award|certificate of|anugerah|recognition/.test(t)) return 'awards';
  if(/conference|proceedings|symposium|colloquium/.test(t)) return 'conferences';
  if(/isbn|book chapter|publisher/.test(t) && !/journal/.test(t)) return 'books';
  if(/magazine|newspaper|online media/.test(t)) return 'media';
  if(/journal|doi|abstract|issn/.test(t)) return 'publications';
  return 'publications';
}

function doExtract(text){
  const forced = $('#scanType').value;
  const detected = forced === 'auto' ? detectType(text) : forced;

  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  const flat = text.replace(/\s+/g,' ');

  const doi = (flat.match(/\b10\.\d{4,9}\/[^\s"<>]+/)||[''])[0].replace(/[.,;]$/,'');
  const years = (flat.match(/\b(19|20)\d{2}\b/g)||[]);
  const year = years.length ? years.sort().pop() : '';
  const vol = (flat.match(/volume[:\s]+([0-9]+)/i)||[])[1] || '';
  const iss = (flat.match(/issue[:\s]+([0-9]+)/i)||[])[1] || '';
  const pages = (flat.match(/pages?[:\s]+([0-9]+\s*[-–]\s*[0-9]+)/i)||[])[1] || '';
  const issn = (flat.match(/issn[:\s]+([0-9Xx\-]+)/)||[])[1] || '';
  const isbn = (flat.match(/isbn[:\s]+([0-9Xx\-]+)/)||[])[1] || '';
  const title = lines.find(l => l.length > 25 && !/^(journal|authors?|abstract|keywords|doi|volume|year)/i.test(l)) || lines[0] || '';
  const authorLine = lines.find(l => /^authors?[:\s]/i.test(l)) || lines.find(l=>/^[A-Z]\.\s?[A-Za-z]+/.test(l) && l!==title) || '';
  const journal = lines.find(l => /journal|proceedings|publisher/i.test(l) && l!==title) || '';
  const kwLine = lines.find(l => /^keywords?[:\s]/i.test(l)) || '';

  const f = (k, label, val, conf) => ({ k, label, value: val || '', conf: val ? conf : 0, low: !!val && conf < 85 });

  let fields = [];
  if(detected === 'publications'){
    fields = [
      f('type','Publication Type','Journal Article',96),
      f('title','Title',title,97),
      f('authors','Authors',authorLine.replace(/^authors?[:\s]*/i,''),93),
      f('journal','Journal Name',journal,88),
      f('year','Year',year,94),
      f('volume','Volume',vol,72),
      f('issue','Issue',iss,68),
      f('pages','Pages',pages,80),
      f('doi','DOI',doi,97),
      f('issn','ISSN',issn,90),
      f('keywords','Keywords',kwLine.replace(/^keywords?[:\s]*/i,''),86),
      f('indexing','Indexing','Scopus',75),
      f('quartile','Quartile','Q1',62)
    ];
  } else if(detected === 'conferences'){
    fields = [
      f('paperTitle','Paper Title',title,95),
      f('authors','Authors',authorLine,90),
      f('conferenceName','Conference Name',journal,84),
      f('year','Year',year,92),
      f('country','Country','Malaysia',70),
      f('doi','DOI',doi,95)
    ];
  } else if(detected === 'awards'){
    fields = [
      f('awardTitle','Award Title',title,92),
      f('organisation','Awarding Organisation',journal,80),
      f('year','Year',year,90),
      f('level','Level','International',74)
    ];
  } else if(detected === 'grants'){
    fields = [
      f('grantName','Grant Name',title,90),
      f('grantNumber','Grant Number',(flat.match(/\b[A-Z]{2,6}\/\d[A-Za-z0-9\/\-]+/)||[''])[0],82),
      f('fundingAgency','Funding Agency',journal,78),
      f('amount','Amount (RM)',((flat.match(/RM\s?([\d,]+)/i)||[])[1]||'').replace(/,/g,''),85),
      f('year','Year',year,92),
      f('status','Status','Active',70)
    ];
  } else if(detected === 'adminExp'){
    fields = [
      f('position','Position',title,88),
      f('organisation','Organisation',journal,84),
      f('startDate','Start Date',year?`${year}-01-01`:'',72),
      f('appointmentType','Appointment Type','Contract',66)
    ];
  } else if(detected === 'books'){
    fields = [
      f('type','Type','Book Chapter',80),
      f('title','Title',title,94),
      f('authors','Authors',authorLine,88),
      f('publisher','Publisher',journal,80),
      f('isbn','ISBN',isbn,88),
      f('year','Year',year,92)
    ];
  } else {
    fields = [
      f('articleTitle','Article Title',title,92),
      f('outlet','Magazine/Newspaper',journal,78),
      f('date','Date',year?`${year}-01-01`:'',70),
      f('type','Type','Online Media',72)
    ];
  }

  scanResult = { detected, fields };

  const avg = Math.round(fields.filter(x=>x.value).reduce((s,x)=>s+x.conf,0) / Math.max(1, fields.filter(x=>x.value).length));

  $('#scanOutput').innerHTML = `
  <div class="card card-pad">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <div class="section-title" style="margin:0">🧾 Hasil Ekstraksi AI</div>
      <span class="pill sky">Jenis dikesan: ${SCHEMA[detected].icon} ${SCHEMA[detected].label}</span>
      <span class="pill ${avg>=90?'green':avg>=80?'amber':'red'}">Purata Confidence: ${avg}%</span>
      <div style="margin-left:auto" class="btn-row">
        <select id="targetModule" class="role-sel" onchange="scanResult.detected=this.value; renderScanTable()">
          ${Object.keys(SCHEMA).map(k=>`<option value="${k}" ${k===detected?'selected':''}>${SCHEMA[k].label}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="scanTable"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-primary" onclick="confirmScan()">✅ Confirm &amp; Save (auto-sync ☁️)</button>
      <button class="btn" onclick="scanResult=null; document.getElementById('scanOutput').innerHTML='';">✕ Batal</button>
    </div>
    <div class="hint warn" style="margin-top:12px">Field bertanda 🟠 mempunyai confidence rendah — sila semak sebelum simpan.</div>
  </div>`;

  renderScanTable();
  [4,5].forEach(i=>document.getElementById('step'+i)?.classList.add('done'));
}

  const rows = scanResult.fields.map((f,i)=>`

function _commitScan(){
  const key = scanResult.detected;
  const rec = { id: uid(), _source:'AI Scanner' };
  scanResult.fields.forEach(f=>{ if(f.value) rec[f.k] = f.value; });

  if(key === 'publications' && rec.type) {
    if(/journal/i.test(rec.type)) rec.quartile = rec.quartile || 'Q1';
  }
  DB[key].push(rec);

  const avg = Math.round(scanResult.fields.filter(x=>x.value).reduce((s,x)=>s+x.conf,0) / Math.max(1, scanResult.fields.filter(x=>x.value).length));
  log('Added Record via AI', SCHEMA[key].title(rec)||key, 'AI Scanner', { confidence: avg, verified: true });

  scanResult = null;
  save();
  $('#scanOutput').innerHTML = `<div class="hint ok"><b>✅ Rekod berjaya disimpan ke ${SCHEMA[key].label}.</b> Auto-sync ke Cloud sedang dijalankan.</div>`;

/* =========================================================
   13. SYNC ENGINE v4 — AUTO + RETRY + KEEPALIVE
   ========================================================= */
const SYNC = {
  timer:null, inflight:false, retries:0,
  maxRetries:6, debounceMs:600,
  status:'idle', lastReason:'change', queue:0, dirty:false,

  markDirty(){ SYNC.dirty = true; },

  schedule(reason){
    SYNC.dirty = true;
    SYNC.lastReason = reason || SYNC.lastReason || 'change';
    SYNC.queue++;
    if(!DB.cloud.autoSync){ SYNC.setStatus('idle'); return; }
    if(!navigator.onLine){ SYNC.setStatus('offline'); return; }
    clearTimeout(SYNC.timer);
    SYNC.setStatus('pending');
    SYNC.timer = setTimeout(()=>SYNC.flush(SYNC.lastReason), SYNC.debounceMs);
  },

  async flush(reason){
    if(SYNC.inflight){ setTimeout(()=>SYNC.flush(reason), 500); return false; }
    if(!navigator.onLine){ SYNC.setStatus('offline'); return false; }
    clearTimeout(SYNC.timer);
    SYNC.inflight = true;
    SYNC.setStatus('busy');
    const ok = await cloudPush({ silent:true, reason });
    SYNC.inflight = false;

    if(ok){
      SYNC.retries = 0; SYNC.queue = 0; SYNC.dirty = false;
      SYNC.setStatus('ok');
      return true;
    }
    SYNC.retries++;
    if(SYNC.retries <= SYNC.maxRetries){
      const wait = Math.min(2000 * SYNC.retries, 15000);
      SYNC.setStatus('retry');
      setTimeout(()=>SYNC.flush(reason + '-retry' + SYNC.retries), wait);
    } else {
      SYNC.setStatus('error');
      setTimeout(()=>{ SYNC.retries=0; SYNC.flush('recover'); }, 45000);
    }
    return false;
  },

  setStatus(s){
    SYNC.status = s;
    const dot = document.getElementById('syncDot');
    const lbl = document.getElementById('syncLabel');
    if(!dot || !lbl) return;
    const map  = { idle:'off', pending:'busy', busy:'busy', ok:'on', error:'off', offline:'off', retry:'busy' };
    const text = {
      idle:'Cloud idle', pending:'Sync pending…', busy:'Syncing…',
      ok:'☁️ Auto-synced', error:'⚠️ Sync failed', offline:'📴 Offline', retry:'⟳ Retrying…'
    };
    dot.className = 'sync-dot ' + (map[s]||'off');
    lbl.textContent = text[s] || s;
  },

  flushKeepalive(){
    try{
      if(!DB.cloud.autoSync || !navigator.onLine) return;
      if(!SYNC.dirty && !SYNC.timer && SYNC.queue===0) return;

      const full = buildCloudPayload();
      let body = JSON.stringify(full);

      if(body.length > 60000){
        const minimal = {
          action:'updateResume',
          timestamp:new Date().toISOString(),
          source:'Academic Profile System (beacon-minimal)',
          key: DB.cloud.key || '',
          sheet: DB.cloud.sheet || 'Resume',
          auth:{ userId:CURRENT_USER.id, name:CURRENT_USER.name, email:CURRENT_USER.email, role:CURRENT_ROLE },
          profile: DB.profile,
          summary:{ publications:(DB.publications||[]).length, completeness: profileCompleteness() },
          data:{
            publications: DB.publications||[], grants: DB.grants||[],
            projects: DB.projects||[], awards: DB.awards||[],
            conferences: DB.conferences||[], supervision: DB.supervision||[]
          }
        };
        body = JSON.stringify(minimal);
      }

      fetch(CLOUD_URL, {
        method:'POST', keepalive:true,
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body, redirect:'follow'
      }).catch(()=>{});

      if(navigator.sendBeacon){
        try{ navigator.sendBeacon(CLOUD_URL, new Blob([body], {type:'text/plain;charset=utf-8'})); }catch(e){}
      }

      SYNC.dirty = false;
    }catch(e){}
  }
};
window.SYNC = SYNC;

});

async function syncAndLogout(){
  const btn = document.getElementById('btnUpdateAndLogout');
  const prog = document.getElementById('logoutProgress');
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Menghantar ke Cloud…`; }
  if(prog){ prog.style.display='block'; prog.className='logout-progress'; prog.innerHTML = `⏳ Menghantar data ke Google Sheets…`; }

  try{
    clearTimeout(SYNC.timer);
    SYNC.queue = 0;
    const ok = await cloudPush({ silent:true, reason:'logout' });

    if(ok){
      if(prog){ prog.className='logout-progress done'; prog.innerHTML = `✅ Resume berjaya dihantar ke Google Sheets. Melog keluar…`; }
      SYNC.dirty = false;
      setTimeout(()=>forceLogout(), 900);
    } else {
      if(prog){ prog.className='logout-progress err'; prog.innerHTML = `❌ Sync gagal. Sila cuba lagi atau pilih "Log Out Sahaja".`; }
      if(btn){ btn.disabled = false; btn.innerHTML = `☁️ Cuba Lagi & Log Out`; }
    }
  }catch(err){
    if(prog){ prog.className='logout-progress err'; prog.innerHTML = `❌ Ralat: ${esc(err.message)}`; }
    if(btn){ btn.disabled = false; btn.innerHTML = `☁️ Cuba Lagi & Log Out`; }
  }
}

function syncLog(msg, cls){
  const el = document.getElementById('syncLog');
  if(!el) return;
  const t = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.innerHTML = `<span class="t">[${t}]</span> <span class="${cls||''}">${msg}</span>`;

function buildCloudPayload(){
  return {
    action: 'updateResume',
    timestamp: new Date().toISOString(),
    source: 'Academic Profile System',
    key: DB.cloud.key || '',
    sheet: DB.cloud.sheet || 'Resume',
    auth: { userId: CURRENT_USER.id, name: CURRENT_USER.name, email: CURRENT_USER.email, role: CURRENT_ROLE },
    profile: DB.profile,
    summary: {
      publications: (DB.publications||[]).length,
      grants: (DB.grants||[]).length,
      totalGrants: totalGrants(),
      projects: (DB.projects||[]).length,
      awards: (DB.awards||[]).length,
      completeness: profileCompleteness()
    },
    cvHtml: (function(){
      try {
        let el = document.getElementById('cvDoc');
        let created = false;
        if(!el){ el = document.createElement('div'); el.id='cvDoc'; el.style.display='none'; document.body.appendChild(el); created=true; }
        const prev = el.innerHTML;
        generateCV();
        const html = el.innerHTML;
        if(created){ el.remove(); } else { el.innerHTML = prev; }
        return html;
      } catch(e){ return ''; }
    })(),
    data: {
      qualifications: DB.qualifications||[], teaching: DB.teaching||[], projects: DB.projects||[],
      grants: DB.grants||[], publications: DB.publications||[], conferences: DB.conferences||[],
      books: DB.books||[], awards: DB.awards||[], media: DB.media||[], adminExp: DB.adminExp||[],
      supervision: DB.supervision||[], consultancy: DB.consultancy||[], memberships: DB.memberships||[],
      community: DB.community||[], innovation: DB.innovation||[], ip: DB.ip||[]
    }
  };
}

async function cloudPost(payload){
  const body = JSON.stringify(payload);
  try {
    const res = await fetch(CLOUD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body, redirect: 'follow'
    });
    const text = await res.text();
    let json = null; try { json = JSON.parse(text); } catch(e){}
    return { ok: res.ok, status: res.status, text, json, opaque:false };
  } catch(err) {
    try {
      await fetch(CLOUD_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body, redirect: 'follow'
      });
      return { ok: true, status: 0, text: '(opaque — CORS blocked response)', json:null, opaque:true };
    } catch(err2){
      return { ok: false, status: 0, text: err2.message, json:null, error:true };
    }
  }
}

function setBusy(id, busy, label){
  const b = document.getElementById(id);
  if(!b) return;
  if(busy){ b.dataset.label = b.innerHTML; b.disabled = true; b.innerHTML = `<span class="spin"></span> ${label||'Processing…'}`; }
  else { b.disabled = false; if(b.dataset.label) b.innerHTML = b.dataset.label; }
}

async function cloudTest(){
  setBusy('btnTest', true, 'Testing…');
  syncLog('🔌 Menyemak sambungan…','in');
  try{
    const url = CLOUD_URL + '?action=ping&t=' + Date.now();
    const res = await fetch(url, { method:'GET', redirect:'follow' });
    const text = await res.text();
    syncLog(`✅ Sambungan OK (HTTP ${res.status}). ${esc(text.slice(0,120))}`,'ok');
    toast('Sambungan OK ✔');
  }catch(err){
    syncLog(`❌ Gagal: ${esc(err.message)}`,'er');
    syncLog('💡 Semak: Deploy → Execute as "Me", Who has access "Anyone".','t');
    toast('Sambungan gagal ✖');
  }finally{ setBusy('btnTest', false); }
}
window.cloudTest = cloudTest;

async function cloudPush(opts){
  opts = opts || {};
  const silent = !!opts.silent;
  if(!silent) setBusy('btnPush', true, 'Menghantar…');
  syncLog(`⬆ Push${opts.reason?' ('+opts.reason+')':''}…`,'in');

  const payload = buildCloudPayload();
  syncLog(`📦 Payload: ${(JSON.stringify(payload).length/1024).toFixed(1)} KB`,'t');

  try{
    const r = await cloudPost(payload);

    if(r.ok){
      DB.cloud.lastPush = new Date().toISOString();
      log('Cloud Sync — Pushed', DB.profile.name||'Profile', 'Cloud Sync', { confidence:100, verified:true });
      save();
      syncLog(r.opaque
        ? '✅ Hantar berjaya (respons opaque).'
        : `✅ Berjaya. ${esc((r.text||'').slice(0,160))}`,'ok');
      if(!silent) toast('☁️ Resume dihantar ✔');
      if(state.view==='cloudSync') render(); else renderSidebar();
      return true;
    } else {
      syncLog(`❌ HTTP ${r.status}: ${esc((r.text||'').slice(0,200))}`,'er');
      if(!silent) toast('Sync gagal ✖');
      return false;
    }
  }catch(err){
    syncLog(`❌ Ralat: ${esc(err.message)}`,'er');
    if(!silent) toast('Sync gagal ✖');
    return false;
  }finally{
    if(!silent) setBusy('btnPush', false);
  }
}
window.cloudPush = cloudPush;

async function quickCloudPush(){
  toast('☁️ Force sync…');
  clearTimeout(SYNC.timer);
  const ok = await SYNC.flush('manual-force');
  toast(ok ? '☁️ Resume disegerakkan ✔' : 'Sync gagal — semak log');
}
window.quickCloudPush = quickCloudPush;

async function cloudPull(){
  setBusy('btnPull', true, 'Menarik…');
  syncLog('⬇ Menarik…','in');
  try{
    const url = CLOUD_URL + '?action=getResume&userId=' + encodeURIComponent(CURRENT_USER.id) +
                '&key=' + encodeURIComponent(DB.cloud.key||'') + '&t=' + Date.now();
    const res = await fetch(url, { method:'GET', redirect:'follow' });
    const text = await res.text();
    let json = null; try { json = JSON.parse(text); } catch(e){}
    if(!json){ syncLog(`⚠️ Bukan JSON: ${esc(text.slice(0,200))}`,'er'); toast('Tarik gagal'); return; }

    const incoming = json.data || json.profile || json;
    if(incoming.profile && confirm('Ganti profil dengan data Cloud?')){
      DB.profile = { ...DB.profile, ...incoming.profile };
    }
    Object.keys(SCHEMA).forEach(k=>{ if(Array.isArray(incoming[k])) DB[k] = incoming[k]; });

    DB.cloud.lastPull = new Date().toISOString();
    log('Cloud Sync — Pulled', DB.profile.name||'Profile', 'Cloud Sync');
    save(); render();
    syncLog('✅ Data ditarik.','ok');
    toast('⬇ Data Cloud dimuatkan ✔');
  }catch(err){
    syncLog(`❌ ${esc(err.message)}`,'er');
    toast('Tarik gagal ✖');
  }finally{ setBusy('btnPull', false); }
}
window.cloudPull = cloudPull;

function doSearch(){
  const q = ($('#sq').value||'').trim().toLowerCase();
  state.q = q;
  if(!q){ $('#searchRes').innerHTML = ''; return; }

  const p = DB.profile;
  const hit = (txt) => String(txt||'').toLowerCase().includes(q);
  const matches = [];

  if(hit(p.expertise)) matches.push(['Expertise', p.expertise]);
  if(hit(p.researchInterest)) matches.push(['Research Interest', p.researchInterest]);
  if(hit(p.keywords)) matches.push(['Keywords', p.keywords]);

  const rel = k => (DB[k]||[]).filter(r => JSON.stringify(r).toLowerCase().includes(q));

  const pubs = rel('publications'), projs = rel('projects'), grants = rel('grants'),
        teach = rel('teaching'), innov = rel('innovation'), comm = rel('community');

  const total = pubs.length + projs.length + grants.length + teach.length + innov.length + comm.length + matches.length;

  $('#searchRes').innerHTML = `
  <div class="card card-pad" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="font-size:36px">${esc(p.photo||'👤')}</div>
      <div style="flex:1">
        <div style="font-weight:800;font-size:16px">${esc(p.title||'')} ${esc(p.name||'')}</div>
        <div class="muted small">${esc(p.position||'')} · ${esc(p.faculty||'')}</div>
      </div>
      <span class="pill ${total?'green':'gray'}">${total} padanan</span>
      <button class="btn btn-sm" onclick="go('public')">Lihat Profil →</button>
    </div>
  </div>

  ${matches.length ? `<div class="card card-pad" style="margin-bottom:16px">
    <div class="section-title">🎯 Padanan Kepakaran</div>
    ${matches.map(([l,v])=>`<div style="margin-bottom:8px"><span class="pill sky">${l}</span> <span class="small">${esc(v)}</span></div>`).join('')}
  </div>`:''}

  ${resultBlock('📚 Publications', pubs, x=>x.title, x=>`${x.journal||''} · ${x.year||''}`)}
  ${resultBlock('🔬 Research Projects', projs, x=>x.title, x=>`${x.role||''} · ${x.status||''}`)}
  ${resultBlock('💰 Grants', grants, x=>x.grantName, x=>`${x.fundingAgency||''} · ${money(x.amount)}`)}
  ${resultBlock('👨‍🏫 Teaching', teach, x=>x.courseName, x=>`${x.courseCode||''} · ${x.academicYear||''}`)}
  ${resultBlock('💡 Innovation', innov, x=>x.title, x=>`${x.category||''} · ${x.year||''}`)}
  ${resultBlock('🌍 Community', comm, x=>x.programmeName, x=>`${x.organisation||''} · ${x.sdg||''}`)}

  ${total===0 ? `<div class="card"><div class="empty"><div class="big">🤷</div><p>Tiada padanan untuk "${esc(q)}".</p></div></div>`:''}`;
}
window.doSearch = doSearch;

function resultBlock(title, arr, tFn, sFn){
  if(!arr.length) return '';
  return `<div class="card card-pad" style="margin-bottom:16px">
    <div class="section-title">${title} <span class="pill gray">${arr.length}</span></div>
    ${arr.slice(0,8).map(x=>`<div style="padding:9px 0;border-bottom:1px solid #f1f5f9">
        <b class="small">${esc(tFn(x)||'')}</b>
        <div class="muted small">${esc(sFn(x))}</div>
      </div>`).join('')}
  </div>`;
}

    ${noYear.length? `<div style="margin-top:14px">${noYear.map(p=>`<div style="padding:9px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:10px;align-items:center">

      </div>`).join('')}</div>`:''}
    ${!DB.profile.orcid ? `<div class="hint warn" style="margin-top:14px">🆔 ORCID belum diisi pada profil. <button class="btn btn-sm" onclick="go('profile')">Tambah ORCID</button></div>`:''}
  </div>

  <div class="card card-pad">
    <div class="section-title">⚠️ Possible Duplicate</div>
    ${dups.length ? dups.map((group,gi)=>`
      <div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px">
        <div class="pill red" style="margin-bottom:10px">Possible duplicate publication detected</div>
        ${group.map(p=>`<div style="padding:7px 0;border-bottom:1px solid #f1f5f9">
            <b class="small">${esc(p.title)}</b>
            <div class="muted small">${esc(p.journal||'')} · ${esc(p.year||'')} · DOI: ${esc(p.doi||'—')}</div>
          </div>`).join('')}
        <div class="btn-row" style="margin-top:12px">
          <button class="btn btn-sm btn-primary" onclick="mergeDup(${gi})">Merge (auto-sync)</button>
          <button class="btn btn-sm" onclick="toast('Rekod dikekalkan berasingan')">Keep Separate</button>
        </div>
      </div>`).join('') : '<p class="muted small">Tiada pertindihan dikesan. 👍</p>'}
  </div>`;
};

function mergeDup(gi){
  const dups = findDuplicates();
  const group = dups[gi];
  if(!group || group.length<2) return;
  const keep = group[0];
  const dropIds = group.slice(1).map(g=>g.id);
  DB.publications = DB.publications.filter(p=>!dropIds.includes(p.id));
  log('Merged Duplicate', keep.title||'Publication', 'Data Quality');
  save(); render(); toast('Rekod digabungkan ✔ — sync…');
  clearTimeout(SYNC.timer);
  SYNC.flush('after-merge');
}
window.mergeDup = mergeDup;

    <div class="section-title">📝 Audit Trail — Data Governance</div>
    <p class="muted small">Setiap perubahan direkodkan: siapa, bila, sumber (Manual / AI Scanner / Cloud Sync) dan tahap keyakinan.</p>
  </div>
  <div class="card">
    ${DB.audit.length===0 ? '<div class="empty"><div class="big">📝</div><p>Tiada aktiviti direkodkan lagi.</p></div>' :
    `<div class="tbl-wrap"><table>
      <thead><tr><th>Pengguna</th><th>Aktiviti</th><th>Sumber</th><th>Confidence</th><th>Tarikh</th></tr></thead>
      <tbody>${DB.audit.map(a=>`
        <tr>
          <td><b>${esc(a.who)}</b></td>
          <td>${esc(a.action)}<br><span class="muted small">${esc(a.target||'')}</span></td>
          <td><span class="pill ${a.source==='AI Scanner'?'sky':a.source==='Data Quality'?'amber':a.source==='Cloud Sync'?'green':'gray'}">${esc(a.source)}</span></td>
          <td>${a.confidence?`<span class="pill ${a.confidence>=90?'green':'amber'}">${a.confidence}%</span>`:'<span class="muted">—</span>'}</td>
          <td class="muted small">${fmtDate(a.date)}</td>
        </tr>`).join('')}
      </tbody></table></div>`}
  </div>`;
};

/* =========================================================
   24. INIT
   ========================================================= */
function bootApp(){
  if(!sessionStorage.getItem('apsSignedInLogged')){
    sessionStorage.setItem('apsSignedInLogged','1');
    log('Signed in to portal', CURRENT_USER.name, 'Auth');
    save();
  }
  render();
  SYNC.setStatus(DB.cloud.lastPush ? 'ok' : 'idle');

  const hasData = Object.keys(SCHEMA).some(k => (DB[k]||[]).length > 0);
  if(hasData && DB.cloud.autoSync){
    setTimeout(()=>SYNC.schedule('initial-load'), 1000);
  }
}

document.addEventListener('DOMContentLoaded', bootApp);
if(document.readyState !== 'loading') bootApp();
</script>
</body>
</html>
